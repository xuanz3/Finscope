name: Platform Packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New release candidate tag (example: v1.0.0-rc.5)'
        required: true
        default: 'v1.0.0-rc.5'
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: bash scripts/build.sh macos
      - uses: actions/upload-artifact@v4
        with: {name: macos, path: dist/FinScope-macOS.dmg, if-no-files-found: error}
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - run: bash scripts/build.sh android
      - uses: actions/upload-artifact@v4
        with: {name: android, path: dist/FinScope-Android.apk, if-no-files-found: error}
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: choco install innosetup -y --no-progress
      - run: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with: {name: windows, path: dist/FinScope-Windows-Setup.exe, if-no-files-found: error}
  ios-build-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: xcodebuild -downloadPlatform iOS
      - run: bash scripts/build.sh ios
  draft-release:
    if: github.ref == 'refs/heads/main'
    needs: [macos, android, windows, ios-build-check]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: packages, merge-multiple: true}
      - name: Verify and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          cd packages
          for name in FinScope-macOS.dmg FinScope-Android.apk FinScope-Windows-Setup.exe; do test -s "$name"; done
          sha256sum FinScope-* > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "FinScope $RELEASE_TAG" --notes 'Preview release. macOS and Windows installers are not notarized/code-signed for public distribution; Android uses development signing unless configured separately. Verify on target devices before publishing. iOS distribution is not included. Historical and sample data only; no real trades.' FinScope-* SHA256SUMS.txt
