name: Platform Packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash scripts/build.sh macos
      - uses: actions/upload-artifact@v4
        with:
          name: FinScope-macOS-unsigned
          path: dist/*.dmg
          if-no-files-found: error
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash scripts/build.sh ios
      - run: ditto -c -k --keepParent build/ios/iphoneos/Runner.app FinScope-iOS-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FinScope-iOS-unsigned-not-installable
          path: FinScope-iOS-unsigned.zip
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - run: bash scripts/build.sh android
      - uses: actions/upload-artifact@v4
        with:
          name: FinScope-Android-development-signing
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: choco install innosetup -y --no-progress
      - run: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FinScope-Windows-unsigned
          path: dist/*.exe
          if-no-files-found: error
